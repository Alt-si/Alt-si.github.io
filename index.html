<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía TV Argentina</title>
<meta name="description" content="Línea de tiempo con la programación de los canales de TV de Argentina para los próximos 5 días.">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Guía TV <span>Argentina</span></h1>
    <div class="actions" id="guideActions">
      <button id="zoomOut" class="icon-btn" aria-label="Alejar">−</button>
      <button id="zoomIn" class="icon-btn" aria-label="Acercar">+</button>
      <button id="installBtn" class="pill" hidden>⬇ Instalar</button>
      <button id="nowBtn" class="pill strong">Ahora</button>
    </div>
  </div>
  <div id="guideBar">
    <nav id="days" class="days" aria-label="Día"></nav>
    <div class="filters">
      <div id="providers" class="chips" role="group" aria-label="Favoritos"></div>
      <select id="category" aria-label="Categoría"></select>
      <input id="search" type="search" placeholder="Buscar canal o programa" aria-label="Buscar">
    </div>
    <div id="banner" class="banner" hidden></div>
  </div>
</header>

<main id="grid" class="grid" tabindex="0" aria-label="Grilla de programación"></main>

<dialog id="sheet">
  <form method="dialog"><button class="close" aria-label="Cerrar">×</button></form>
  <div id="sheetBody"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
