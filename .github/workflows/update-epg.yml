name: Actualizar programación

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar grillas (iptv-org/epg)
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-src
          cd epg-src
          (npm ci || npm install) 2>&1 | tail -5
          mkdir -p ../xmltv
          for site in $(cat ../tools/sites.txt); do
            echo "=================== $site"
            ls "sites/$site" 2>&1 | head -20
            npm run grab --- --site="$site" --days=5 --output="../xmltv/$site.xml" 2>&1 | tail -40 || true
          done
          echo "=== archivos generados"
          ls -la ../xmltv

      - name: Convertir a epg.json
        run: |
          if ! ls xmltv/*.xml >/dev/null 2>&1; then
            echo "::error::Ninguna fuente generó datos. Mirá el paso anterior (qué sitio falló y por qué)."
            exit 1
          fi
          node tools/xmltv-to-json.mjs xmltv/*.xml

      - name: Publicar cambios
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add data/epg.json
          git diff --cached --quiet || (git commit -m "Actualizar programación" && git push)
