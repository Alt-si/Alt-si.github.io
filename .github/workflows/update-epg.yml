name: Actualizar programación

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"   # 00, 06, 12 y 18 h de Argentina (evita 21-24 h, cuando la fuente ya cuenta el día siguiente)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar iptv-org/epg
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-src
          cd epg-src
          (npm ci || npm install) 2>&1 | tail -3
          echo "--- opciones de grab:"
          npm run grab -- --help 2>&1 | tail -30

      - name: Descargar grillas
        run: |
          mkdir -p xmltv
          cd epg-src
          for f in $(cat ../tools/sites.txt); do
            n=$(basename "$f" .channels.xml)
            echo "=================== $f"
            node ../tools/filter-channels.mjs "sites/$f" "../xmltv/$n.channels.xml" || continue
            npm run grab -- --channels="../xmltv/$n.channels.xml" --days=5 --output="../xmltv/$n.xml" 2>&1 | tail -25 || true
          done
          echo "=== archivos generados"
          ls -la ../xmltv

      - name: Descargar deportes de otros países
        continue-on-error: true
        run: |
          mkdir -p xmltv/sports
          cd epg-src
          echo "--- fuentes disponibles en iptv-org (para sumar más países/canales):"
          ls sites | tr '\n' ' ' | head -c 9000; echo
          while IFS='|' read -r f country code; do
            [ -z "$f" ] && continue
            n=$(basename "$f" .channels.xml)
            echo "=================== $f ($country)"
            [ -f "sites/$f" ] || { echo "no existe sites/$f"; continue; }
            node ../tools/filter-sports.mjs "sites/$f" "../xmltv/sports/$n.channels.xml" "../xmltv/sports/$n.map.json" "$country" "SP$code" || continue
            npm run grab -- --channels="../xmltv/sports/$n.channels.xml" --days=5 --output="../xmltv/sports/$n.xml" 2>&1 | tail -3 || true
          done < ../tools/sports-sites.txt
          ls -la ../xmltv/sports

      - name: Convertir a epg.json
        run: |
          files=$(ls xmltv/*.xml 2>/dev/null | grep -v '\.channels\.xml$' || true)
          if [ -z "$files" ]; then
            echo "::error::Ninguna fuente generó datos. Mirá el paso anterior."
            exit 1
          fi
          echo "--- commit de esta ejecución: $(git log -1 --format=%h)"
          echo "--- sitios configurados:"; cat tools/sites.txt
          echo "--- canales de interés que SÍ están en la lista filtrada (xmltv_id / nombre):"
          grep -hE 'Star|NatGeo|Syfy|Baby|Nick|MTV|Lifetime|Paramount|Cartoonito|A&amp;E|AE\.ar' xmltv/*.channels.xml | head -40 || true
          echo "--- programas por canal en la salida cruda (los de menos programas primero):"
          for f in $files; do grep -o ' channel="[^"]*"' $f | sort | uniq -c | sort -n | head -50; done
          node tools/xmltv-to-json.mjs $files

      - name: Descargar fixtures (jugadores y equipos)
        continue-on-error: true
        run: node tools/fetch-fixtures.mjs

      - name: Construir deportes
        run: node tools/build-sports.mjs xmltv/sports

      - name: Publicar cambios
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add data/epg.json data/sports.json data/fixtures.json 2>/dev/null || git add data/epg.json data/sports.json
          git diff --cached --quiet || (git commit -m "Actualizar programación" && git push)
