name: Noticias 9 de Julio

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python tools/noticias_9dejulio.py
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain app-9dejulio/noticias.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add app-9dejulio/noticias.json
            git commit -m "Actualizar noticias de 9 de Julio"
            git push
          fi
