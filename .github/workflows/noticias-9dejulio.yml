name: Noticias 9 de Julio

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python tools/noticias_9dejulio.py
      - run: python tools/noticias_polo.py
        continue-on-error: true
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain app-9dejulio/noticias.json app-9dejulio/noticias-img app-9dejulio/polo.json app-9dejulio/polo-img)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            for f in app-9dejulio/noticias.json app-9dejulio/noticias-img app-9dejulio/polo.json app-9dejulio/polo-img; do [ -e "$f" ] && git add -A "$f"; done
            git commit -m "Actualizar noticias de 9 de Julio y del Polo San Cayetano"
            git push
          fi
